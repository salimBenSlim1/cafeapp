services:
  - type: web
    name: cafe-app-backend
    env: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MYSQL_URL
        sync: false # This will be set manually in Render dashboard
      - key: JWT_SECRET
        sync: false # This will be set manually in Render dashboard
      - key: API_KEY
        sync: false # This will be set manually in Render dashboard
      - key: ALLOWED_ORIGINS
        sync: false # This will be set manually in Render dashboard